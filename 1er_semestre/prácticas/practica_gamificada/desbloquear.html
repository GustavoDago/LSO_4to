<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.O.S. - Decodificador de Clave Maestra | LSO</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b11;
            --card-bg: rgba(17, 24, 39, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-glow: #3b82f6;
            --success-glow: #10b981;
            --error-glow: #ef4444;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Cyber Grid Overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(18, 24, 38, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 24, 38, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            z-index: 10;
        }

        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.05);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .panel::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(59, 130, 246, 0.05) 50%, transparent 55%);
            transform: rotate(30deg);
            animation: gloss-sweep 6s infinite linear;
            pointer-events: none;
        }

        @keyframes gloss-sweep {
            0% { transform: translate(-30%, -30%) rotate(30deg); }
            100% { transform: translate(30%, 30%) rotate(30deg); }
        }

        .logo {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--primary-glow);
            font-weight: 600;
            margin-bottom: 12px;
            display: inline-block;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 16px;
            border-radius: 50px;
            background: rgba(59, 130, 246, 0.08);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* Passcode Grid Inputs */
        .key-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 10px;
            margin-bottom: 35px;
            justify-content: center;
        }

        .key-input {
            width: 100%;
            aspect-ratio: 1 / 1.15;
            background: rgba(8, 12, 21, 0.8);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .key-input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.35), inset 0 2px 4px rgba(0,0,0,0.6);
            transform: translateY(-2px);
        }

        .key-input.filled {
            border-color: rgba(255,255,255,0.25);
        }

        /* Buttons and Status */
        .action-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff;
            border: none;
            padding: 16px 40px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3), 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 78, 216, 0.45), 0 0 30px rgba(59, 130, 246, 0.2);
            filter: brightness(1.1);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        /* Feedback Screen */
        .status-container {
            margin-top: 25px;
            min-height: 24px;
        }

        .status-msg {
            font-size: 0.95rem;
            font-weight: 600;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Dynamic States */
        .panel.shake {
            animation: shake-error 0.5s ease-in-out;
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(239, 68, 68, 0.15);
        }

        @keyframes shake-error {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
            20%, 40%, 60%, 80% { transform: translateX(6px); }
        }

        /* Terminal screen (Success) */
        .terminal-screen {
            display: none;
            text-align: left;
            font-family: 'Share Tech Mono', monospace;
            background: #020617;
            border: 1px solid #10b981;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
            margin-top: 10px;
        }

        .terminal-line {
            color: #10b981;
            margin-bottom: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            opacity: 0;
            transform: translateY(5px);
            animation: fade-in-line 0.3s forwards;
        }

        @keyframes fade-in-line {
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-error {
            color: #f87171;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            color: #34d399;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
            margin-bottom: 10px;
            text-align: center;
        }

        /* Glitch text effect on success */
        .glitch {
            position: relative;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020617;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -1px 0 #ef4444;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -1.5px 0 #3b82f6;
            clip: rect(85px, 450px, 140px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(15px, 9999px, 66px, 0); }
            100% { clip: rect(34px, 9999px, 55px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(70px, 9999px, 105px, 0); }
            100% { clip: rect(12px, 9999px, 85px, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel" id="mainPanel">
            <div id="setupView">
                <span class="logo">Operación Limpieza</span>
                <h1 id="titleText">Decodificar Clave</h1>
                <p class="subtitle" id="subtitleText">
                    Ingresa secuencialmente los códigos de los 9 analistas.<br>
                    C1 (CPU) a C9 (Hash). Todo el equipo debe aportar su fragmento.
                </p>

                <!-- 9 digit code input -->
                <div class="key-grid">
                    <input type="text" class="key-input" maxlength="1" autofocus data-index="0">
                    <input type="text" class="key-input" maxlength="1" data-index="1">
                    <input type="text" class="key-input" maxlength="1" data-index="2">
                    <input type="text" class="key-input" maxlength="1" data-index="3">
                    <input type="text" class="key-input" maxlength="1" data-index="4">
                    <input type="text" class="key-input" maxlength="1" data-index="5">
                    <input type="text" class="key-input" maxlength="1" data-index="6">
                    <input type="text" class="key-input" maxlength="1" data-index="7">
                    <input type="text" class="key-input" maxlength="1" data-index="8">
                </div>

                <button class="action-btn" id="verifyBtn">ENVIAR CLAVE DE CONTROL</button>

                <div class="status-container">
                    <div class="status-msg alert-error" id="errorMsg">CÓDIGO DE ACCESO INCORRECTO. REVISA LAS HUELLAS DEL INTRUSO.</div>
                </div>
            </div>

            <!-- Terminal Decrypting View -->
            <div class="terminal-screen" id="terminalView">
                <!-- Lines will be injected dynamically via JS -->
            </div>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.key-input');
        const verifyBtn = document.getElementById('verifyBtn');
        const mainPanel = document.getElementById('mainPanel');
        const errorMsg = document.getElementById('errorMsg');
        const setupView = document.getElementById('setupView');
        const terminalView = document.getElementById('terminalView');

        // Master password to check (Case Insensitive)
        const CORRECT_KEY = "K23SOHTY5";

        // Auto focus jumping logic
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (input.value.length > 0) {
                    input.classList.add('filled');
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else {
                    input.classList.remove('filled');
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].value = '';
                    inputs[index - 1].classList.remove('filled');
                }
            });
        });

        // Verification Trigger
        verifyBtn.addEventListener('click', verifyKey);

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyKey();
            }
        });

        function verifyKey() {
            let combinedKey = "";
            inputs.forEach(input => {
                combinedKey += input.value.trim().toUpperCase();
            });

            if (combinedKey === CORRECT_KEY) {
                showSuccessAnimation();
            } else {
                showErrorAnimation();
            }
        }

        function showErrorAnimation() {
            errorMsg.style.display = "block";
            errorMsg.style.opacity = "1";
            mainPanel.classList.add('shake');
            
            // Clear inputs and refocus first
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('filled');
            });
            inputs[0].focus();

            setTimeout(() => {
                mainPanel.classList.remove('shake');
            }, 500);
        }

        function showSuccessAnimation() {
            setupView.style.display = "none";
            terminalView.style.display = "block";

            const logLines = [
                "[SYSTEM] Iniciando desencripción de canal seguro...",
                "[SYSTEM] Cargando módulos de recuperación de emergencia LSO...",
                "[AUDIT] Validando clave de redundancia provista por el equipo...",
                "[AUDIT] Descifrando nodo 1 (CPU/Apolo_13)... OK",
                "[AUDIT] Descifrando nodo 2 (Regedit/Delay)... OK",
                "[AUDIT] Descifrando nodo 3 (Regedit/Fonts)... OK",
                "[AUDIT] Descifrando nodo 4 (Netstat/Puerto_4444)... OK",
                "[AUDIT] Descifrando nodo 5 (BCDedit/Boot)... OK",
                "[AUDIT] Descifrando nodo 6 (Reliability_Monitor/Siberia.exe)... OK",
                "[AUDIT] Descifrando nodo 7 (Eventvwr/ID_1337)... OK",
                "[AUDIT] Descifrando nodo 8 (Services/LSO_Service)... OK",
                "[AUDIT] Descifrando nodo 9 (Forense/MD5_Hash)... OK",
                "[SYSTEM] Reconstrucción de firma maestra exitosa.",
                "[SYSTEM] Restaurando parámetros de interfaz de Windows...",
                "[SYSTEM] Limpiando procesos de sobrecarga e intrusión de red...",
                "----------------------------------------------------------",
                "SUCCESS",
                "¡SERVIDOR RESTABLECIDO Y SEGURO!",
                "Operación 'Limpieza LSO' Completada. Excelente trabajo, Analistas de 4to B."
            ];

            let lineIndex = 0;
            
            function printLine() {
                if (lineIndex < logLines.length) {
                    const lineText = logLines[lineIndex];
                    const div = document.createElement('div');
                    div.classList.add('terminal-line');
                    
                    if (lineText.includes("SUCCESS")) {
                        div.className = "alert-success glitch";
                        div.setAttribute('data-text', "¡SISTEMA SALVADO!");
                        div.innerText = "¡SISTEMA SALVADO!";
                    } else if (lineText.includes("RESTABLECIDO")) {
                        div.className = "alert-success";
                        div.innerText = lineText;
                        div.style.fontSize = "1.05rem";
                    } else if (lineText.includes("ERROR") || lineText.includes("Fallo")) {
                        div.classList.add('alert-error');
                        div.innerText = lineText;
                    } else {
                        div.innerText = lineText;
                    }

                    // Set delay for print
                    div.style.animationDelay = `${lineIndex * 150}ms`;
                    terminalView.appendChild(div);
                    lineIndex++;
                    
                    // Auto scroll to bottom
                    terminalView.scrollTop = terminalView.scrollHeight;
                    
                    setTimeout(printLine, 200);
                }
            }

            printLine();
        }
    </script>
</body>
</html>
